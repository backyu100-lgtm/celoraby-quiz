<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CELORABY 肌悩み診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#F5C4B3; --coral-d:#E89F86; --coral-l:#FCEDE7;
  --navy:#1B2A4A; --navy-2:#3A4A6B; --mute:#7A8499;
  --white:#FFFFFF; --bg:#FBF8F6; --line:#ECE4DF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--navy);font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;background:var(--white);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(27,42,74,.06)}
.logo{font-family:Montserrat,sans-serif;font-weight:600;letter-spacing:.38em;font-size:13px;color:var(--navy);text-align:center;padding:22px 0 0}
.screen{display:none;padding:28px 24px 40px;animation:fade .45s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* intro */
.hero-badge{display:inline-block;font-size:11px;letter-spacing:.12em;background:var(--navy);color:#fff;padding:5px 12px;border-radius:2px}
.intro{text-align:center;padding-top:36px}
.intro h1{font-family:"Shippori Mincho",serif;font-size:28px;line-height:1.5;margin:22px 0 14px;font-weight:700}
.intro h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--coral) 62%)}
.intro p{font-size:14px;line-height:1.9;color:var(--navy-2)}
.intro-visual{margin:30px auto 28px;border-radius:24px;background:linear-gradient(180deg,#fff 0%,var(--coral-l) 100%);padding:18px 10px 0;overflow:hidden}
.intro-visual img{display:block;width:100%;height:auto}
.meta{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--mute);margin-bottom:28px}
.meta span::before{content:"✓ ";color:var(--coral-d)}

.btn{display:block;width:100%;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.06em;padding:17px;border-radius:999px;background:var(--navy);color:#fff;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.3;cursor:default}
.btn.coral{background:var(--coral-d)}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line);font-weight:500}

/* quiz */
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--coral-d);transition:width .4s ease}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-top:6px}
.back{background:none;border:none;color:var(--mute);font-family:inherit;font-size:12px;cursor:pointer;padding:4px 0}
.qnum{font-family:Montserrat,sans-serif;font-size:13px;color:var(--coral-d);letter-spacing:.1em;margin:34px 0 8px;font-weight:600}
.qtitle{font-family:"Shippori Mincho",serif;font-size:22px;line-height:1.55;font-weight:700}
.qsub{font-size:12px;color:var(--mute);margin-top:8px}
.opts{display:grid;gap:10px;margin:26px 0 28px}
.opts.grid2{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;cursor:pointer;font-family:inherit;font-size:14px;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;transition:all .18s}
.opts.grid2 .opt{flex-direction:column;text-align:center;gap:6px;padding:18px 10px}
.opt .ic{font-size:22px;line-height:1}
.opt small{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.opt:hover{border-color:var(--coral)}
.opt.on{border-color:var(--coral-d);background:var(--coral-l);box-shadow:0 0 0 1px var(--coral-d) inset}
.opt.on::after{content:"✓";margin-left:auto;color:var(--coral-d);font-weight:700}
.opts.grid2 .opt.on::after{display:none}

/* loading */
.loading{text-align:center;padding-top:120px}
.loading p{font-family:"Shippori Mincho",serif;font-size:18px;margin-top:28px}
.loading small{display:block;color:var(--mute);font-size:12px;margin-top:10px}
.spinner{width:64px;height:64px;margin:0 auto;border-radius:50%;border:3px solid var(--coral-l);border-top-color:var(--coral-d);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* result */
.result{padding-top:10px}
.reveal{text-align:center;position:relative;padding:30px 0 10px}
.reveal .lead{font-size:13px;color:var(--mute);letter-spacing:.1em}
.reveal .type{font-family:"Shippori Mincho",serif;font-size:21px;font-weight:700;margin:8px 0 4px}
.stage{position:relative;width:240px;height:240px;margin:24px auto 10px}
.stage .glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--coral-l) 0%,var(--coral-l) 55%,transparent 70%);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.stage .rays{position:absolute;inset:-30px;background:repeating-conic-gradient(from 0deg,rgba(245,196,179,.35) 0 6deg,transparent 6deg 24deg);border-radius:50%;animation:spin 18s linear infinite;-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 72%);mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 72%)}
.stage .prod{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both .15s}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:burst 1.2s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.jajan{font-family:Montserrat,sans-serif;font-size:12px;letter-spacing:.3em;color:var(--coral-d);font-weight:600}
.pname-ja{font-family:"Shippori Mincho",serif;font-size:24px;font-weight:700;line-height:1.4;margin-top:6px}
.pname-en{font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:.18em;color:var(--mute);margin-top:6px}
.catch{display:inline-block;margin-top:14px;font-size:13px;background:var(--navy);color:#fff;padding:6px 14px;border-radius:999px}
.badges{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:14px}
.badges span{font-size:11px;border:1px solid var(--coral-d);color:var(--coral-d);padding:3px 9px;border-radius:999px}

.sec{margin-top:34px}
.sec h3{font-family:"Shippori Mincho",serif;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.sec h3::before{content:"";width:4px;height:18px;background:var(--coral-d);border-radius:2px}
.sec .desc{font-size:12px;color:var(--mute);margin:6px 0 16px 14px}

.mycon{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mycon span{font-size:12px;background:var(--coral-l);padding:5px 11px;border-radius:999px}

.card{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;background:#fff;opacity:0;animation:fade .5s ease forwards}
.card .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.card .worry{font-weight:700;color:var(--navy);font-size:14px}
.card .arrow{color:var(--coral-d)}
.card .ing{display:inline-block;margin-top:10px;font-weight:700;font-size:15px;color:var(--navy);background:linear-gradient(transparent 60%,var(--coral) 60%)}
.card p{font-size:13px;line-height:1.85;color:var(--navy-2);margin-top:8px}

.points{list-style:none;counter-reset:p}
.points li{counter-increment:p;position:relative;padding:14px 0 14px 46px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.7}
.points li::before{content:counter(p,decimal-leading-zero);position:absolute;left:0;top:13px;font-family:Montserrat,sans-serif;font-weight:600;color:var(--coral-d);font-size:18px}
.points li b{display:block;font-size:14px}
.points li small{font-size:12px;color:var(--mute)}

.howto{background:var(--bg);border-radius:16px;padding:18px}
.howto ol{padding-left:18px;font-size:13px;line-height:2;color:var(--navy-2)}

.pair{display:flex;gap:14px;align-items:center;border:1px dashed var(--coral-d);border-radius:16px;padding:16px;margin-bottom:12px}
.pair .thumb{flex:0 0 74px;height:90px;display:flex;align-items:center;justify-content:center;background:var(--coral-l);border-radius:12px}
.pair .tag{font-size:11px;color:var(--coral-d);font-weight:700}
.pair .nm{font-weight:700;font-size:14px;margin:3px 0}
.pair p{font-size:12px;color:var(--navy-2);line-height:1.7}
.pair a{display:inline-block;margin-top:6px;font-size:12px;color:var(--navy);font-weight:700}

.cta{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 26%);padding:26px 0 16px;margin-top:20px}
.cta a.btn{text-decoration:none;text-align:center}
.cta .sub{text-align:center;font-size:11px;color:var(--mute);margin-top:8px}
.again{margin-top:12px}
.note{font-size:10px;color:var(--mute);line-height:1.7;margin-top:24px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="logo">CELORABY</div>

  <!-- INTRO -->
  <section class="screen active" id="s-intro">
    <div class="intro">
      <span class="hero-badge">薬局コスメ発 ／ 肌悩み診断</span>
      <h1>あなたの肌悩みに<br><em>ぴったりの処方</em>を<br>見つけましょう</h1>
      <p>6つの質問に答えるだけ。<br>肌悩みに合わせて、成分から選んだ<br>セロラバイのアイテムをご提案します。</p>
      <div class="intro-visual" id="introVisual"></div>
      <div class="meta"><span>約1分</span><span>全6問</span><span>無料</span></div>
      <button class="btn" onclick="start()">診断をはじめる</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="s-quiz">
    <div class="qhead"><button class="back" id="backBtn" onclick="prev()">← 戻る</button><span id="qcount"></span></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="qnum" id="qnum"></div>
    <h2 class="qtitle" id="qtitle"></h2>
    <div class="qsub" id="qsub"></div>
    <div class="opts" id="opts"></div>
    <button class="btn" id="nextBtn" onclick="next()" disabled>次へ</button>
  </section>

  <!-- LOADING -->
  <section class="screen" id="s-load">
    <div class="loading">
      <div class="spinner"></div>
      <p id="loadText">回答を分析しています…</p>
      <small>あなたの肌悩みと成分をマッチング中</small>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="s-result"><div class="result" id="result"></div></section>
</div>

/* ============================================================
   ▼ スコアリング
   ============================================================ */
const W = {
  cream:{sag:3,dry:2,dull:2,wrinkle:1,pore:0,black:0,trouble:1},
  gf:   {wrinkle:3,sag:2,dry:2,trouble:2,dull:1,pore:1,black:0},
  pore: {pore:3,black:3,trouble:2,dull:1,dry:0,sag:0,wrinkle:0}
};
function score(a){
  const s={cream:0,gf:0,pore:0};
  for(const k in s){
    s[k]+= (W[k][a.main]||0)*3;
    (a.sub||[]).forEach(c=> s[k]+= W[k][c]||0);
  }
  // 肌タイプ
  if(a.skin==="dry"){s.cream+=2;s.gf+=1}
  if(a.skin==="oily"){s.pore+=2}
  if(a.skin==="mix"){s.pore+=1;s.cream+=1}
  if(a.skin==="sens"){s.gf+=2;s.pore+=1}
  // 年代
  if(a.age==="20"){s.pore+=2}
  if(a.age==="30"){s.cream+=1;s.pore+=1}
  if(a.age==="40"){s.cream+=2;s.gf+=1}
  if(a.age==="50"){s.gf+=2;s.cream+=2}
  // テクスチャー
  if(a.tex==="light"){s.pore+=2}
  if(a.tex==="moist"){s.gf+=2}
  if(a.tex==="rich"){s.cream+=3}
  // 同点時はヒーロー商品を優先
  const order=["cream","gf","pore"];
  return order.slice().sort((x,y)=> s[y]-s[x] || order.indexOf(x)-order.indexOf(y));
}

/* ============================================================

   ============================================================ */
let step=0; const ans={sub:[]};
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");window.scrollTo({top:0})}
function start(){step=0;show("s-quiz");renderQ()}
function renderQ(){
  const q=QUESTIONS[step];
  $("qcount").textContent=`${step+1} / ${QUESTIONS.length}`;
  $("bar").style.width=((step)/QUESTIONS.length*100)+"%";
  $("qnum").textContent="Q"+String(step+1).padStart(2,"0");
  $("qtitle").innerHTML=q.title;
  $("qsub").textContent=q.sub||"";
  $("backBtn").style.visibility=step?"visible":"hidden";
  const box=$("opts"); box.className="opts"+(q.grid?" grid2":""); box.innerHTML="";
  let opts=q.opts;
  if(q.id==="sub") opts=q.opts.filter(o=>o.v!==ans.main);
  opts.forEach(o=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<span class="ic">${o.ic}</span><span>${o.t}${o.s?`<small>${o.s}</small>`:""}</span>`;
    const sel=q.multi?(ans.sub||[]).includes(o.v):ans[q.id]===o.v;
    if(sel)b.classList.add("on");
    b.onclick=()=>{
      if(q.multi){
        const arr=ans.sub; const i=arr.indexOf(o.v);
        i>-1?arr.splice(i,1):arr.push(o.v); b.classList.toggle("on");
      }else{
        ans[q.id]=o.v; box.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); b.classList.add("on");
        if(q.id==="main") ans.sub=ans.sub.filter(v=>v!==o.v);
        setTimeout(next,260);
      }
      updNext();
    };
    box.appendChild(b);
  });
  $("nextBtn").textContent= step===QUESTIONS.length-1?"結果を見る":"次へ";
  updNext();
}
function updNext(){const q=QUESTIONS[step];$("nextBtn").disabled=!(q.optional||ans[q.id])}
function next(){const q=QUESTIONS[step];if(!(q.optional||ans[q.id]))return;if(step<QUESTIONS.length-1){step++;renderQ()}else finish()}
function prev(){if(step>0){step--;renderQ()}}

function finish(){
  $("bar").style.width="100%";
  show("s-load");
  const msgs=["回答を分析しています…","肌悩みと成分をマッチング中…","あなたにぴったりの処方が見つかりました！"];
  let i=0; $("loadText").textContent=msgs[0];
  const t=setInterval(()=>{i++; if(i<msgs.length)$("loadText").textContent=msgs[i]; else{clearInterval(t);renderResult()}},800);
}

function restart(){for(const k in ans)delete ans[k];ans.sub=[];start()}

function burst(){
  const st=$("stage"); if(!st)return;
  const cols=["#F5C4B3","#E89F86","#1B2A4A","#FFD9CB"];
  for(let i=0;i<28;i++){
    const d=document.createElement("i");d.className="spark";
    const a=Math.random()*Math.PI*2, r=110+Math.random()*80;
    d.style.left="50%";d.style.top="50%";
    d.style.background=cols[i%cols.length];
    d.style.setProperty("--x",Math.cos(a)*r+"px");d.style.setProperty("--y",Math.sin(a)*r+"px");
    d.style.animationDelay=(.25+Math.random()*.25)+"s";
    st.appendChild(d); setTimeout(()=>d.remove(),1800);
  }
}

function svg(shape,h){
  if(IMG[shape]) return h>100
    ? `<img src="${IMG[shape]}" alt="" style="height:${h+50}px;width:auto;max-width:200px;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(27,42,74,.18))">`
    : `<img src="${IMG[shape]}" alt="" style="height:${h+10}px;width:auto;max-width:${h}px;object-fit:contain">`;
  const N="#1B2A4A",C="#F5C4B3",D="#E89F86";
  const label=(y,t,s=7)=>`<text x="50" y="${y}" text-anchor="middle" font-family="Montserrat" font-size="${s}" letter-spacing="1.6" fill="${N}">${t}</text>`;
  if(shape==="tube") return `<svg height="${h}" viewBox="0 0 100 160"><rect x="38" y="138" width="24" height="18" rx="3" fill="${N}"/><path d="M24 14 h52 l-6 124 h-40z" fill="${C}"/><rect x="24" y="8" width="52" height="8" rx="2" fill="${D}"/>${label(60,"CELORABY",6.5)}<text x="50" y="82" text-anchor="middle" font-family="Montserrat" font-weight="600" font-size="9" fill="${N}">RETU-GEL</text>${label(94,"ECM CREAM",5.5)}</svg>`;
  if(shape==="pump") return `<svg height="${h}" viewBox="0 0 100 160"><rect x="44" y="4" width="22" height="8" rx="2" fill="${N}"/><rect x="47" y="10" width="6" height="16" fill="${N}"/><rect x="38" y="24" width="24" height="14" rx="3" fill="${N}"/><rect x="26" y="38" width="48" height="114" rx="10" fill="#fff" stroke="${N}" stroke-width="2"/>${label(80,"CELORABY",6.5)}<text x="50" y="102" text-anchor="middle" font-family="Montserrat" font-weight="600" font-size="13" fill="${D}">4GF</text>${label(114,"HYDRO SERUM",5)}</svg>`;
  if(shape==="dropper") return `<svg height="${h}" viewBox="0 0 100 160"><ellipse cx="50" cy="14" rx="10" ry="12" fill="${N}"/><rect x="40" y="22" width="20" height="18" rx="2" fill="${N}"/><rect x="28" y="40" width="44" height="112" rx="8" fill="${C}" opacity=".85"/><rect x="34" y="70" width="32" height="50" rx="3" fill="#fff"/>${label(86,"CELORABY",5)}<text x="50" y="100" text-anchor="middle" font-family="Montserrat" font-weight="600" font-size="8" fill="${N}">PORE</text>${label(110,"SERUM",5)}</svg>`;
